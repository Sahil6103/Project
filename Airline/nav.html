    <header class="relative flex justify-between items-center py-8 px-3">
        <div class="logo w-[20%]">
            <img src="img/logo1.webp" alt="Logo" class="w-full">
        </div>

        <!-- Wrapper for login and toggle, using order to position them as needed -->
        <div class="flex items-center gap-3 md:order-3">
            <div class="login flex justify-center items-center gap-2 order-1 md:order-none">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" />
                    <path
                        d="M7.5 17C9.832 14.558 14.143 14.443 16.5 17M14.495 9.5C14.495 10.881 13.374 12 11.992 12C10.609 12 9.488 10.881 9.488 9.5C9.488 8.119 10.609 7 11.992 7C13.374 7 14.495 8.119 14.495 9.5Z"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <span class="text-[#404040] font-medium">Login</span>
            </div>

            <div class="toggle md:hidden cursor-pointer order-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
                    <path d="M4 8.5L20 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M4 15.5L20 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>
        </div>

        <nav
            class="fixed top-0 left-0 w-full h-full bg-white flex flex-col items-center justify-center transform translate-x-full md:static md:translate-x-0 md:flex-row md:h-auto transition-transform duration-300 ease-in-out z-50 md:order-2">
            <a href="index.html"
                class="text-[#404040] font-medium text-lg no-underline tracking-[0.5px] py-2 px-4 rounded-full transition-colors duration-300 hover:bg-[#8acaf4] hover:text-white">Home</a>
            <a href="aircraft.html"
                class="text-[#404040] font-medium text-lg no-underline tracking-[0.5px] py-2 px-4 rounded-full transition-colors duration-300 hover:bg-[#8acaf4] hover:text-white">Our
                AirCraft</a>
            <a href="safety.html"
                class="text-[#404040] font-medium text-lg no-underline tracking-[0.5px] py-2 px-4 rounded-full transition-colors duration-300 hover:bg-[#8acaf4] hover:text-white">Safety</a>
            <a href="charters.html"
                class="text-[#404040] font-medium text-lg no-underline tracking-[0.5px] py-2 px-4 rounded-full transition-colors duration-300 hover:bg-[#8acaf4] hover:text-white">Charters</a>
            <a href="contact.html"
                class="text-[#404040] font-medium text-lg no-underline tracking-[0.5px] py-2 px-4 rounded-full transition-colors duration-300 hover:bg-[#8acaf4] hover:text-white">Contact
                Us</a>
            <div class="close absolute top-8 right-6 md:hidden cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
                    <path d="M19 5L5 19M5 5L19 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>
        </nav>
    </header>


    <script>
        document.querySelector(".toggle").addEventListener("click", () => {
            document.querySelector("nav").classList.toggle("translate-x-full");
        });

        document.querySelector(".close").addEventListener("click", () => {
            document.querySelector("nav").classList.add("translate-x-full");
        });
    </script>
